name: Daily AI digest

on:
  schedule:
    # 20:17 UTC = 06:17 AEST (UTC+10) the next morning. Not on the hour on purpose: GitHub
    # drops or delays scheduled runs at :00 when its queue is overloaded.
    - cron: "17 20 * * *"
  workflow_dispatch: {}    # lets you press "Run workflow" to test

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: dylan.pugh@moyo.co
